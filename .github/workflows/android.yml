name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_voice:
        description: "Record the narrator's sentences (slow the first time after the voice changes). Turn off to only test and build the app."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the narrator voice
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/kokoro
          key: voice-${{ hashFiles('scripts/fetch-voice.sh') }}

      - name: Fetch the narrator voice
        run: scripts/fetch-voice.sh

      # Every sentence the game can say is recorded here, so the phone only plays sound files
      # (decision #45). Recordings are kept between builds; only new sentences are made.
      - name: List every sentence the narrator can say
        run: ./gradlew :engine:voiceLines

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the voice recorder
        run: |
          pip install sherpa-onnx==1.13.8 numpy
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Keep recordings between builds
        uses: actions/cache@v4
        with:
          path: voice-cache
          key: voice-clips-${{ hashFiles('engine/build/voice/lines.txt', 'scripts/render-voice.py') }}
          restore-keys: voice-clips-

      - name: Record the narrator's sentences
        if: github.event_name != 'workflow_dispatch' || inputs.record_voice
        run: python3 scripts/render-voice.py engine/build/voice/lines.txt app/src/main/assets/kokoro voice-cache app/src/main/assets/voice

      - name: Test the engine and build the app
        run: ./gradlew :engine:test :app:assembleDebug --stacktrace

      # Simulated children play many journeys: how long it takes, which skills come up, whether levels drift.
      - name: Balance report
        run: |
          ./gradlew :engine:balanceReport -q
          cat engine/build/balance/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: the-little-dungeon-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # On main, replace the "latest" pre-release so the newest APK is always one tap away on the phone.
      - name: Publish the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk the-little-dungeon.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest the-little-dungeon.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. On the phone, download the-little-dungeon.apk and open it to install."
